[project]
name = "swifty-agent2"
version = "0.0.0"
description = "Swifty Agent2 Python Force"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "grpcio-tools>=1.84.0",
    "milvus-lite>=3.2.1",
    "numpy>=2.5.3",
    "onnx>=1.22.0",
    "onnxruntime>=1.30.0",
    "pymilvus>=3.0.1",
    "ruff>=0.16.7",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

# uv syncs the dependencies but never builds/installs this repo as a Python package (it is a Node project).
[tool.uv]
package = false

# Generated protobuf/gRPC stubs (regenerate via `make milvus-proto`): machine-generated,
# never hand-edited, so ruff check/format must leave them byte-for-byte alone.
# force-exclude: honor the exclusion even when the files are passed explicitly on the CLI.
[tool.ruff]
force-exclude = true
extend-exclude = [
    "src/milvus/kb_store_pb2.py",
    "src/milvus/kb_store_pb2_grpc.py",
]

# Strict typing for the vendored train training pipeline (scripts/train/py). Scoped via `files`
# so a bare `mypy` run targets only this typed subtree and leaves the other loose scripts alone.
[tool.mypy]
python_version = "3.13"
strict = true
files = ["scripts/train/py"]

# scikit-learn and onnxruntime ship no py.typed marker / stubs; treat them as Any at the boundary.
[[tool.mypy.overrides]]
module = ["sklearn.*", "onnxruntime.*"]
ignore_missing_imports = true
