[project]
name = "swifty-agent2"
version = "0.0.0"
description = "Swifty Agent2 Python Force"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "grpcio-tools>=1.84.0",
    "httpx>=0.27",
    "mcp>=1.15",
    "milvus-lite>=3.2.1",
    "numpy>=2.5.3",
    "onnx>=1.22.0",
    "onnxruntime>=1.30.0",
    "pydantic>=2.9",
    "pymilvus>=3.0.1",
    "python-dotenv>=1.0",
    "ruff>=0.16.7",
    "scikit-learn>=1.9.1",
    "structlog>=24.4",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    # Typed grpc stubs: the mypy-protobuf-generated .pyi files are written
    # against a typed `grpc`, and src/milvus/server.py checks against both.
    "grpc-stubs>=1.53",
    # protoc plugin generating the .pyi stubs next to the pb2 modules, so
    # src/milvus/server.py type-checks against the generated message classes.
    "mypy-protobuf>=3.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
    "respx>=0.22",
]

# uv syncs the dependencies but never builds/installs this repo as a Python package (it is a Node
# project). The mcp/ server therefore has no console script: run it with `mcp/` as the working
# directory so `app` resolves, e.g. `cd mcp && uv run python -m app.main`.
[tool.uv]
package = false

# Generated protobuf/gRPC stubs (regenerate via `make milvus-proto`): machine-generated,
# never hand-edited, so ruff check/format must leave them byte-for-byte alone.
# force-exclude: honor the exclusion even when the files are passed explicitly on the CLI.
[tool.ruff]
force-exclude = true
extend-exclude = [
    "src/milvus/pb",
    ".agents",
]

# Default rules (E4/E7/E9/F) plus import sorting and the modernization/bugbear/async rules the mcp/
# server was written under. E501 stays off: line width is `ruff format`'s job, and the pre-existing
# training/milvus comments intentionally exceed the format width.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing training scripts use `l` as a jsonl-line loop variable; kept as authored.
"scripts/train/py/*.py" = ["E741"]

# The mcp/ server's package lives at mcp/app and is resolved via pytest's `pythonpath = ["mcp"]`;
# from the repo root isort cannot infer it as first-party on its own.
[tool.ruff.lint.isort]
known-first-party = ["app"]

# Strict typing for the vendored train training pipeline (scripts/train/py), the mcp/ server
# (mcp/app + mcp/tests) and the Milvus gRPC bridge (src/milvus). Scoped via `files` so a bare
# `mypy` run targets only these typed subtrees and leaves the other loose scripts alone.
[tool.mypy]
python_version = "3.13"
strict = true
files = ["scripts/train/py", "mcp/app", "mcp/tests", "src/milvus"]
# The generated pb2 modules are machine-generated (`make milvus-proto`); mypy consumes the
# .pyi stubs generated next to them instead of type-checking the .py sources.
exclude = ["src/milvus/pb/kb_store_pb2(_grpc)?\\.py$"]
# server.py imports the generated modules flat (`import kb_store_pb2`), the way the
# grpc-generated code does, so the pb directory is a module search root.
mypy_path = "src/milvus/pb"

# scikit-learn and onnxruntime ship no py.typed marker / stubs; treat them as Any at the boundary.
[[tool.mypy.overrides]]
module = ["sklearn.*", "onnxruntime.*"]
ignore_missing_imports = true

# pymilvus ships no py.typed marker / stubs; treat it as Any at the boundary. grpc is typed
# via grpc-stubs and google.protobuf via types-protobuf (both dev deps, see above).
[[tool.mypy.overrides]]
module = ["pymilvus.*"]
ignore_missing_imports = true

# The only Python tests in this repo are the mcp/ server's; `tests/` at the root is vitest.
# `pythonpath` puts mcp/ on sys.path so `import app` resolves from the repo root.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["mcp/tests"]
pythonpath = ["mcp"]
