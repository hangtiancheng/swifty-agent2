<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MeowMeow Select AI Assistant Meow: ask about products, orders, and after-sales support"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MeowMeow Select</title>
    <script>
      // Decide light/dark before first paint to avoid a theme flash
      // (mirrors app/lib/theme.ts: stored preference, else system setting).
      (function () {
        try {
          var t = localStorage.getItem("swifty_agent2_theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (t === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
